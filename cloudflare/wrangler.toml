# 뽀득뽀득 목욕탕 relay Worker (CLOUDFLARE-SETUP.md). Today one route:
#   GET /turn   fresh Cloudflare Realtime TURN credentials ({iceServers, ttl}, minted per request, ttl 2 h) for the
#               game's online rooms (PeerJS / WebRTC), only for the game's own pages (ALLOWED_ORIGINS below)
# (a later route, /room/<code>, will add a WebSocket relay on a Durable Object to this same Worker)
# Deploy from this folder:  npx wrangler deploy
# The TURN key's two secrets are set with wrangler, never written here or anywhere in the repo:
#   npx wrangler secret put TURN_KEY_ID
#   npx wrangler secret put TURN_KEY_API_TOKEN
name = "ppodeuk-relay"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
# the pages that may ask for credentials: exact origins, '*' = one host label part (the PR preview channels
# bubble-c3ad4--pr23-ab12cd34.web.app); space- or comma-separated
ALLOWED_ORIGINS = "https://bubble-c3ad4.web.app https://bubble-c3ad4.firebaseapp.com https://bubble-c3ad4--*.web.app https://bobo33772-blip.github.io https://ppodeuk-bath.apps.tossmini.com https://ppodeuk-bath.private-apps.tossmini.com"
# "1": also http://localhost:<port> / 127.0.0.1 / [::1] (local testing against the deployed Worker); "0" when live
ALLOW_LOCALHOST = "0"

# a light abuse guard: at most 10 requests a minute per client IP (per Cloudflare location). A real player asks once
# per page visit (the answer is reused for almost 2 h). Without this binding the Worker still counts per isolate
[[ratelimits]]
name = "TURN_RATE"
namespace_id = "7301"

  [ratelimits.simple]
  limit = 10
  period = 60

[observability]
enabled = true
